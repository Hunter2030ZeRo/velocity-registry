[workspace]
resolver = "2"
members = [
    "crates/velocity-manifest",
    "crates/velocity-index",
]

[workspace.package]
edition = "2021"
rust-version = "1.80"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
semver = { version = "1.0", features = ["serde"] }
toml = "0.8"
thiserror = "2.0"
clap = { version = "4.5", features = ["derive"] }
bincode = "1.3"
zstd = "0.13"
sha2 = "0.10"
hex = "0.4"
walkdir = "2.5"
