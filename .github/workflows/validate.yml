name: Validate registry

on:
  pull_request:
    paths:
      - "packages/**"
      - "crates/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - ".github/workflows/validate.yml"
  push:
    branches: [main]
    paths:
      - "packages/**"
      - "crates/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - ".github/workflows/validate.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Tests
        run: cargo test --workspace --all-targets

      - name: Validate manifests
        run: cargo run -p velocity-index -- validate --packages packages

      - name: Compile registry
        run: cargo run -p velocity-index -- build --packages packages --output /tmp/velocity.idx.zst

      - name: Verify registry artifacts exist
        run: |
          test -s /tmp/velocity.idx.zst
          test -s /tmp/velocity.idx.zst.sha256
